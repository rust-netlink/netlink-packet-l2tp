[package]
name = "netlink-packet-l2tp"
version = "0.4.0"
authors = [
    "Gris Ge <cnfourt@gmail.com>",
    "metastable-void <mori@menhera.ad.jp>",
]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/rust-netlink/netlink-packet-l2tp"
keywords = ["netlink", "linux", "l2tp"]
license = "MIT"
readme = "README.md"
description = "L2TP generic netlink packet definitions"

[dependencies]
netlink-packet-core = "1.0.0-rc1"
netlink-packet-generic = { git = "https://github.com/rust-netlink/netlink-packet-generic", branch = "main" }

[dev-dependencies]
pretty_assertions = "1.4.1"
